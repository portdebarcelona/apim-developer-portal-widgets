name: Developer Portal Frontend - PRE

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: developer-portal-frontend-pre
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, test and deploy SPA
    runs-on: ubuntu-latest
    environment: PRE
    env:
      VITE_AUTH_MODE: entra
      VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
      VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
      VITE_BFF_SCOPE: ${{ vars.VITE_BFF_SCOPE }}
      VITE_BFF_BASE_URL: ${{ vars.VITE_BFF_BASE_URL }}
      VITE_APIM_PORTAL_URL: ${{ vars.VITE_APIM_PORTAL_URL }}
      VITE_APIM_GATEWAY_URL: ${{ vars.VITE_APIM_GATEWAY_URL }}
      VITE_DOCS_CLIENT_ID: ${{ vars.VITE_DOCS_CLIENT_ID }}
      VITE_DOCS_TENANT_ID: ${{ vars.VITE_DOCS_TENANT_ID }}
      VITE_DOCS_REDIRECT_BASE_URL: ${{ vars.VITE_DOCS_REDIRECT_BASE_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/developer-portal/package-lock.json

      - name: Install dependencies
        working-directory: apps/developer-portal
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/developer-portal
        run: npm test

      - name: Build production frontend
        working-directory: apps/developer-portal
        run: npm run build

      - name: Verify generated Static Web Apps configuration
        shell: pwsh
        run: |
          $config = Get-Content -Raw apps/developer-portal/dist/staticwebapp.config.json
          if ($config.Contains('__BFF_CONNECT_SOURCE__') -or $config.Contains('__APIM_GATEWAY_SOURCE__')) {
            throw 'Unresolved CSP placeholder in staticwebapp.config.json'
          }
          $bffOrigin = ([uri] $env:VITE_BFF_BASE_URL).GetLeftPart([System.UriPartial]::Authority)
          if (-not $config.Contains($bffOrigin)) {
            throw 'The generated CSP does not contain the configured BFF origin'
          }
          $gatewayOrigin = ([uri] $env:VITE_APIM_GATEWAY_URL).GetLeftPart([System.UriPartial]::Authority)
          if (-not $config.Contains($gatewayOrigin)) {
            throw 'The generated CSP does not contain the configured APIM gateway origin'
          }

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve Static Web Apps deployment token at runtime
        shell: bash
        run: |
          az extension add --name staticwebapp --upgrade
          token="$(az staticwebapp secrets list \
            --name '${{ vars.AZURE_STATIC_WEB_APP_NAME }}' \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --query properties.apiKey \
            --output tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "SWA_DEPLOYMENT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy prebuilt frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: apps/developer-portal/dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true
