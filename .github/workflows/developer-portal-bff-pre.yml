name: Developer Portal BFF - PRE

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: developer-portal-bff-pre
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, test and deploy BFF
    runs-on: ubuntu-latest
    environment: PRE
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DeveloperPortal.slnx

      - name: Test
        run: dotnet test DeveloperPortal.slnx --configuration Release --no-restore

      - name: Publish BFF
        run: >-
          dotnet publish apps/developer-portal-bff/DeveloperPortal.Bff.csproj
          --configuration Release
          --no-restore
          --output publish/bff

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy BFF to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish/bff
