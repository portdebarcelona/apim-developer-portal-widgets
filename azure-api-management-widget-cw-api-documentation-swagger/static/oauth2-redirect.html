<!doctype html>
<html lang="en">
<head>
  <title>Swagger UI: OAuth2 Redirect</title>
</head>
<body>
<!--
  This page is the OAuth2 Authorization Code redirect handler for Swagger UI.

  How it works:
    1. The user clicks "Authorize" in Swagger UI.
    2. Swagger UI opens a popup window pointing to the identity provider (Azure AD / Entra ID).
    3. After the user logs in, the identity provider redirects the popup to THIS page, appending
       either ?code=<code> (auth code flow) or #token=<token> (implicit flow) to the URL.
    4. This page reads those parameters and passes them back to the Swagger UI parent window
       via window.opener.swaggerUIRedirectOauth2.
    5. Swagger UI exchanges the auth code for a token (PKCE) and stores it internally.
    6. All subsequent Try-It-Out requests automatically include the Bearer token.

  Deployment requirement:
    This file MUST be hosted at the URL configured as oauth2RedirectUrl in the widget editor
    (or at <widgetBaseUrl>/oauth2-redirect.html if left empty).

    That URL MUST be registered as a **SPA Redirect URI** in your Azure AD app registration:
      Azure Portal → App registrations → <your app> → Authentication → Redirect URIs → Add URI
      Type: Single-page application (SPA)
-->
<script>
  'use strict';

  function run() {
    var oauth2 = window.opener.swaggerUIRedirectOauth2;
    var sentState = oauth2.state;
    var redirectUrl = oauth2.redirectUrl;
    var isValid, qp, arr;

    // The auth code / token may arrive in the hash fragment or the query string
    if (/code|token|error/.test(window.location.hash)) {
      qp = window.location.hash.substring(1).replace('?', '&');
    } else {
      qp = location.search.substring(1);
    }

    arr = qp.split('&');
    arr.forEach(function(v, i, _arr) {
      _arr[i] = '"' + v.replace('=', '":"') + '"';
    });

    qp = qp
      ? JSON.parse('{' + arr.join() + '}', function(key, value) {
          return key ? decodeURIComponent(value) : value;
        })
      : {};

    isValid = qp.state === sentState;

    if (
      (
        oauth2.auth.schema.get('flow') === 'accessCode' ||
        oauth2.auth.schema.get('flow') === 'authorizationCode' ||
        oauth2.auth.schema.get('flow') === 'authorization_code'
      ) &&
      !oauth2.auth.code
    ) {
      if (!isValid) {
        oauth2.errCb({
          authId: oauth2.auth.name,
          source: 'auth',
          level: 'warning',
          message: 'Authorization may be unsafe: the state parameter was changed by the server.',
        });
      }

      if (qp.code) {
        delete oauth2.state;
        oauth2.auth.code = qp.code;
        oauth2.callback({ auth: oauth2.auth, redirectUrl: redirectUrl });
      } else {
        var oauthErrorMsg;
        if (qp.error) {
          oauthErrorMsg =
            '[' + qp.error + ']: ' +
            (qp.error_description ? qp.error_description + '. ' : 'No access code received from server. ') +
            (qp.error_uri ? 'More info: ' + qp.error_uri : '');
        } else {
          oauthErrorMsg = 'No `code` parameter was found in the redirect URL.';
        }
        oauth2.errCb({
          authId: oauth2.auth.name,
          source: 'auth',
          level: 'error',
          message: oauthErrorMsg,
        });
      }
    } else {
      oauth2.callback({ auth: oauth2.auth, token: qp, isValid: isValid, redirectUrl: redirectUrl });
    }

    window.close();
  }

  if (document.readyState !== 'loading') {
    run();
  } else {
    document.addEventListener('DOMContentLoaded', function() {
      run();
    });
  }
</script>
</body>
</html>
